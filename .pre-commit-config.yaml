repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in lockstep with the `version:` pinned for astral-sh/ruff-action in
    # .github/workflows/ci.yml, or pre-commit and CI will disagree on formatting.
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
