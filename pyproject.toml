[project]
name = "creativity-bench"
version = "0.2.0"
description = "A benchmark suite for measuring creative capabilities of LLMs, based on Gwern's creative-benchmark proposals"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "openai>=1.60",
    "numpy>=1.26",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
creativity-bench = "creativity_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creativity_bench"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Prose corpus: story text is data, rewrapping it would churn content lines.
"src/creativity_bench/data.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
